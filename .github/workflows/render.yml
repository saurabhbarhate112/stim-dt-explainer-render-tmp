name: render
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.t.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: t
        run: |
          T=$(npx remotion compositions src/index.ts 2>/dev/null | awk '/DigitalTwinExplainer/{print $4}')
          echo "frames=$T"
          echo "total=$T" >> "$GITHUB_OUTPUT"

  video:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render part
        run: |
          T=${{ needs.plan.outputs.total }}
          N=6; P=${{ matrix.part }}
          S=$(( T * P / N )); E=$(( T * (P + 1) / N - 1 ))
          echo "frames $S-$E of $T"
          npx remotion render src/index.ts DigitalTwinExplainer out/part$P.mp4 \
            --frames=$S-$E --muted --gl=swangle --concurrency=4 \
            --codec=h264 --crf=17 --x264-preset=slow --pixel-format=yuv420p --timeout=120000
      - uses: actions/upload-artifact@v4
        with: { name: part${{ matrix.part }}, path: out/part${{ matrix.part }}.mp4, retention-days: 1 }

  audio:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npx remotion render src/index.ts DigitalTwinExplainer out/audio.wav --codec=wav --gl=swangle
      - uses: actions/upload-artifact@v4
        with: { name: audio, path: out/audio.wav, retention-days: 1 }

  merge:
    needs: [video, audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Concatenate, loudness-normalise and mux
        run: |
          ls -la parts
          for i in 0 1 2 3 4 5; do echo "file 'parts/part$i.mp4'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy video.mp4
          ffmpeg -y -i parts/audio.wav -af "loudnorm=I=-15:TP=-1.5:LRA=9" -ar 48000 audio_norm.wav
          ffmpeg -y -i video.mp4 -i audio_norm.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart stim-ai-digital-twin-pcb-720p.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact stim-ai-digital-twin-pcb-720p.mp4
      - uses: actions/upload-artifact@v4
        with: { name: final, path: stim-ai-digital-twin-pcb-720p.mp4, retention-days: 3 }
